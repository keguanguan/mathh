id: circle_arrangement_sum_of_differences_lower_bound

title: "Numbers on a Circle: the Sum of Adjacent Differences Is at Least 2(n - 1)"

aliases:
  - sum of absolute differences around a circle
  - 1 to n on a circle minimal total variation
  - walk from 1 to n and back

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 3, The Extremal Principle
  author: Arthur Engel
  accessed: 2026-09-16

additional_sources:
  - name: Fomin, Genkin, Itenberg - Mathematical Circles (Russian Experience)
    url: https://bookstore.ams.org/mcl-7
    original_title: Chapter on invariants
    author: Dmitri Fomin, Sergey Genkin, Ilia Itenberg

problem:
  statement: >
    The numbers 1, 2, ..., n are arranged around a circle in any order. Show
    that the sum of the absolute differences of adjacent numbers is at least
    2(n - 1), and that this is attained.
  domain: combinatorics
  answer: >
    minimum 2(n - 1), attained by the arrangement 1, 3, 5, ..., (odd numbers
    up), ..., 6, 4, 2 (even numbers down)

key_idea:
  name: the circle contains two paths from 1 to n, and along each path the differences telescope to at least n - 1
  category: telescoping
  summary: >
    Going from 1 to n around the circle in either direction, the adjacent
    differences sum to at least n - 1 by the triangle inequality, and the
    two directions use disjoint adjacent pairs, so the total is at least 2(n
    - 1). The arrangement 1, 3, 5, ..., n, ..., 6, 4, 2 attains it.

intuitive_proof:
  explanation: >
    Let the positions of 1 and n split the circle into two arcs. Along
    either arc from 1 to n, the sum of |a_{i+1} - a_i| is at least |n - 1| =
    n - 1 by the triangle inequality (telescoping). The two arcs share no
    adjacent pair, so the total sum over the circle is at least 2(n - 1).
    For the arrangement 1, 3, 5, ..., (largest odd), ..., 6, 4, 2 the
    adjacent differences are 2 except for the two places where the parity
    switches (difference 1), giving 2(n - 2) + 2 = 2(n - 1).

reasoning_structure:
  naive_approach: >
    Try arrangements and minimise by trial.
  crucial_observation: >
    Absolute differences along a path are at least the net change, and the
    circle is two paths between the extreme values.
  why_it_simplifies: >
    Telescoping along the two arcs gives the sharp bound in two lines; the
    construction shows it is tight.

