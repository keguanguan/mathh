id: triangle_fixed_perimeter_equilateral_heron

title: "Fixed Perimeter, Maximal Area: the Equilateral Triangle (Heron plus AM-GM)"

aliases:
  - isoperimetric problem for triangles
  - Heron's formula and AM-GM
  - largest triangle with given perimeter

