id: telescoping_product_one_minus_reciprocal_squares

title: The Product of (1 - 1/k^2) Telescopes

aliases:
  - telescoping product
  - product of (1 - 1/k^2) from 2 to n
  - Wallis-type product

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Telescoping_series
  original_title: Telescoping series (telescoping products)
  accessed: 2026-09-16

