id: sum_k_times_k_factorial

title: 1*1! + 2*2! + ... + n*n! = (n+1)! - 1

aliases:
  - sum of k times k factorial
  - factorial telescoping identity

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 8, The Induction Principle
  author: Arthur Engel
  accessed: 2026-09-16

additional_sources:
  - name: Wikipedia
    url: https://en.wikipedia.org/wiki/Factorial
    original_title: Factorial (identities)

problem:
  statement: >
    Show that 1*1! + 2*2! + ... + n*n! = (n + 1)! - 1.
  domain: algebra
  answer: proved

key_idea:
  name: k * k! = (k + 1)! - k!
  category: telescoping
  summary: >
    Since k * k! = (k + 1 - 1) k! = (k + 1)! - k!, the sum telescopes: (2! -
    1!) + (3! - 2!) + ... + ((n+1)! - n!) = (n + 1)! - 1!.

intuitive_proof:
  explanation: >
    For each k, k * k! = (k + 1) k! - k! = (k + 1)! - k!. Summing from k = 1
    to n, consecutive terms cancel and only (n + 1)! - 1! = (n + 1)! - 1
    survives.

reasoning_structure:
  naive_approach: >
    Verify small cases and prove by induction, which confirms the identity
    without explaining it.
  crucial_observation: >
    Each summand is a difference of consecutive factorials.
  why_it_simplifies: >
    Telescoping gives the closed form in one line and shows why the answer
    involves (n+1)!.

related:
  - telescoping_reciprocal_products

tags:
  - telescoping
  - factorial
  - algebraic identity

quality:
  clarity_of_key_idea: high
  elegance: high
  naive_search_contrast: high
  pedagogical_value: high

familiarity:
  famous: false
  likely_widely_known: true

notes: >
  Consequence: every positive integer has a unique 'factorial number system'
  representation with digits d_k <= k.
