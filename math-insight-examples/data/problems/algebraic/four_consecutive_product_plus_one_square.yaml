id: four_consecutive_product_plus_one_square

title: The Product of Four Consecutive Integers Plus One Is a Perfect Square

aliases:
  - n(n+1)(n+2)(n+3) + 1 is a square
  - product of four consecutive integers
  - 1*2*3*4 + 1 = 25

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Perfect_square
  original_title: Perfect square (examples)
  accessed: 2026-09-16
  notes: Classic algebra exercise; found in Engel and many olympiad primers.

