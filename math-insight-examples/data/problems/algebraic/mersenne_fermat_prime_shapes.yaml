id: mersenne_fermat_prime_shapes

title: If 2^n - 1 Is Prime Then n Is Prime; If 2^n + 1 Is Prime Then n Is a Power of 2

aliases:
  - Mersenne prime exponent is prime
  - Fermat prime exponent is a power of two
  - a^n - 1 factorisation

source:
