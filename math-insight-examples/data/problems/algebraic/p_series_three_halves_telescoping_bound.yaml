id: p_series_three_halves_telescoping_bound

title: Sum of 1/(k sqrt k) Converges, by Comparison with a Telescoping Series

aliases:
  - p-series with p = 3/2
  - comparison with telescoping terms
  - bounding a sum by differences

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 9, Sequences
  author: Arthur Engel
  accessed: 2026-09-16

additional_sources:
  - name: Wikipedia
    url: https://en.wikipedia.org/wiki/Convergence_tests
    original_title: Convergence tests (comparison test)

problem:
  statement: >
    Show that 1 + 1/(2 sqrt 2) + 1/(3 sqrt 3) + ... + 1/(n sqrt n) < 3 for
    all n, so the series converges.
  domain: analysis
  answer: proved (the partial sums are bounded by 3)

key_idea:
  name: bound each term 1/k^{3/2} by a difference 2(1/sqrt(k - 1) - 1/sqrt k), which telescopes
  category: grouping_terms
  summary: >
    For k >= 2, 1/(k sqrt k) < 2/(sqrt(k-1) sqrt k (sqrt(k-1) + sqrt k)) =
    2(1/sqrt(k-1) - 1/sqrt k). Summing from 2 to n telescopes to 2(1 -
    1/sqrt n) < 2, so the whole sum is less than 1 + 2 = 3.

intuitive_proof:
  explanation: >
    For k >= 2, 1/sqrt(k-1) - 1/sqrt k = (sqrt k - sqrt(k-1))/(sqrt k
    sqrt(k-1)) = 1/(sqrt k sqrt(k-1)(sqrt k + sqrt(k-1))) > 1/(sqrt k sqrt k
    * 2 sqrt k) = 1/(2 k sqrt k). Hence 1/(k sqrt k) < 2(1/sqrt(k-1) -
    1/sqrt k). Summing for k = 2, ..., n, the right side telescopes to 2(1 -
    1/sqrt n) < 2. Adding the first term 1 gives a partial sum less than 3.
    Bounded increasing partial sums converge.

reasoning_structure:
  naive_approach: >
    Compare with an integral of x^{-3/2}, which needs calculus, or compare
    termwise with 1/k^2 (which needs its own bound).
  crucial_observation: >
    A term of the form 1/k^{3/2} is dominated by a difference of consecutive
    values of 1/sqrt k, and differences telescope.
  why_it_simplifies: >
    Finding the right telescoping majorant turns a convergence question into
    a two-line inequality; the same trick handles sum of 1/k^2 via 1/(k-1) -
    1/k.

