id: geometric_series_shift

title: Summing a Geometric Series by Shifting

aliases:
  - geometric series formula
  - S - rS trick
  - 1 + r + ... + r^n

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Geometric_series
  original_title: Geometric series (derivation of the sum)
  accessed: 2026-09-16

