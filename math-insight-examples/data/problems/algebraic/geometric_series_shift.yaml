  - name: Engel - Problem-Solving Strategies
    url: https://link.springer.com/book/10.1007/b97682
    original_title: Chapter 9, Sequences
    author: Arthur Engel

problem:
  statement: >
    Find a closed form for S = 1 + r + r^2 + ... + r^n.
  domain: algebra
  answer: (r^{n+1} - 1)/(r - 1) for r != 1

key_idea:
  name: "multiply the sum by r and subtract: almost everything cancels"
  category: telescoping
  summary: >
    rS = r + r^2 + ... + r^{n+1}. Subtracting S from rS cancels all the
    middle terms, leaving rS - S = r^{n+1} - 1.

intuitive_proof:
  explanation: >
    Write S = 1 + r + ... + r^n and rS = r + r^2 + ... + r^{n+1}. The two
    sums share the terms r, r^2, ..., r^n. Subtracting, rS - S = r^{n+1} -
    1, so S (r - 1) = r^{n+1} - 1 and S = (r^{n+1} - 1)/(r - 1) when r != 1.
    For |r| < 1, letting n grow gives the infinite sum 1/(1 - r).

reasoning_structure:
  naive_approach: >
    Guess the formula from small cases and prove it by induction.
  crucial_observation: >
    The series is almost invariant under multiplication by r; the difference
    between S and rS is two terms.
  why_it_simplifies: >
    A self-similarity of the sum reduces it to a single subtraction; the
    same shift trick sums arithmetico-geometric series and evaluates
    generating functions.

