id: am_gm_three_variables_cubes

title: AM-GM for Three Variables from the Cube Factorisation

aliases:
  - three variable AM-GM
  - a^3 + b^3 + c^3 >= 3abc
  - AM-GM via x^3 + y^3 + z^3 - 3xyz

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 7, Inequalities
  author: Arthur Engel
  accessed: 2026-09-16

