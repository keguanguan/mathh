problem:
  statement: >
    Show that 1 + 1/2 + 1/3 + 1/4 + ... diverges, even though the terms tend
    to 0.
  domain: analysis
  answer: proved (diverges)

key_idea:
  name: group the terms into blocks 1/3 + 1/4, 1/5 + ... + 1/8, ...; each block exceeds 1/2
  category: grouping_terms
  summary: >
    The block of terms 1/(2^k + 1) through 1/2^{k+1} has 2^k terms each at
    least 1/2^{k+1}, so it sums to at least 1/2. Infinitely many blocks each
    contribute at least 1/2, so the partial sums exceed every bound.

intuitive_proof:
  explanation: >
    Group the series after the first term into blocks: (1/2), (1/3 + 1/4),
    (1/5 + 1/6 + 1/7 + 1/8), ..., the k-th block running from 1/(2^{k-1} +
    1) to 1/2^k and containing 2^{k-1} terms. Every term of the k-th block
    is at least 1/2^k, so the block sums to at least 2^{k-1} / 2^k = 1/2.
    Hence the partial sum up to 1/2^k is at least 1 + k/2, which is
    unbounded.

reasoning_structure:
  naive_approach: >
    Compute partial sums numerically and see them grow very slowly, which
    suggests convergence to the naive eye; or compare with an integral,
    which requires calculus.
  crucial_observation: >
    Blocks of doubling length have constant lower bounds, because the terms
    shrink only like 1/n.
  why_it_simplifies: >
    A choice of grouping turns a delicate limit question into a sum of
    infinitely many halves; it is the template for comparison arguments.

