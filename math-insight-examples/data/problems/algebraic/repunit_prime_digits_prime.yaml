id: repunit_prime_digits_prime

title: A Repunit with a Composite Number of Digits Is Composite

aliases:
  - repunit primes
  - 111...1 prime implies number of digits prime
  - R_mn divisible by R_m

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Repunit
  original_title: Repunit (factorization)
  accessed: 2026-09-16

additional_sources:
  - name: Engel - Problem-Solving Strategies
    url: https://link.springer.com/book/10.1007/b97682
    original_title: Chapter 6, Number Theory
    author: Arthur Engel

problem:
  statement: >
    Let R_n = 111...1 (n ones). Show that if R_n is prime then n is prime.
  domain: number theory
  answer: proved

key_idea:
  name: "R_{ab} = R_a * (1 + 10^a + 10^{2a} + ... + 10^{(b-1)a}): a repunit with ab digits splits into b blocks of a ones"
  category: factorisation
  summary: >
    Write the ab ones as b blocks of a ones. Then R_{ab} = R_a (1 + 10^a +
    ... + 10^{(b-1)a}), a proper factorisation when a, b > 1. So a prime
    repunit has a prime number of digits (the converse fails: R_3 = 111 = 3
    * 37).

intuitive_proof:
  explanation: >
    For n = ab with a, b > 1, the number R_n consists of b consecutive
    blocks of a ones. The block in position j (from the right, j = 0..b-1)
    contributes R_a * 10^{aj}, so R_n = R_a (1 + 10^a + 10^{2a} + ... +
    10^{(b-1)a}). Both factors exceed 1, so R_n is composite. Equivalently,
    R_n = (10^n - 1)/9 and 10^a - 1 divides 10^{ab} - 1. Hence R_n prime
    forces n prime; R_2 = 11, R_19, R_23 are prime while R_3 = 3 * 37 and
    R_5 = 41 * 271 are not.

reasoning_structure:
  naive_approach: >
    Test repunits for primality directly.
  crucial_observation: >
    Concatenating blocks is multiplication by a geometric sum, so a
    composite length gives a factorisation.
  why_it_simplifies: >
    The same factorisation x^{ab} - 1 = (x^a - 1)(...) that handles Mersenne
    numbers handles repunits in any base.

