id: sum_of_squares_formula_telescoping_cubes

title: The Sum of Squares Formula from Telescoping Cubes

aliases:
  - 1^2 + ... + n^2 = n(n+1)(2n+1)/6
  - sum of squares by telescoping
  - (k+1)^3 - k^3 trick

