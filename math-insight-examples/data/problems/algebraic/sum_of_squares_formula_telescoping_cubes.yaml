problem:
  statement: >
    Derive the formula 1^2 + 2^2 + ... + n^2 = n(n + 1)(2n + 1)/6 without
    guessing it in advance.
  domain: algebra
  answer: n(n+1)(2n+1)/6

key_idea:
  name: sum the identity (k + 1)^3 - k^3 = 3k^2 + 3k + 1 over k; the left side telescopes to (n + 1)^3 - 1
  category: telescoping
  summary: >
    Summing (k + 1)^3 - k^3 = 3k^2 + 3k + 1 from k = 1 to n gives (n + 1)^3
    - 1 = 3 S_2 + 3 S_1 + n, where S_1 = n(n+1)/2 is known. Solving for S_2
    yields the formula.

intuitive_proof:
  explanation: >
    For each k, (k + 1)^3 - k^3 = 3k^2 + 3k + 1. Add these equations for k =
    1, ..., n: the left side telescopes to (n + 1)^3 - 1, and the right side
    is 3 S_2 + 3 S_1 + n with S_1 = 1 + ... + n = n(n+1)/2 and S_2 the
    desired sum. Hence 3 S_2 = (n+1)^3 - 1 - 3n(n+1)/2 - n, and simplifying
    gives S_2 = n(n+1)(2n+1)/6.

reasoning_structure:
  naive_approach: >
    Guess the formula from the values 1, 5, 14, 30 and prove it by
    induction, which verifies but does not derive.
  crucial_observation: >
    The difference of consecutive cubes is a quadratic, so summing it
    expresses the sum of squares through a telescoping sum.
  why_it_simplifies: >
    One telescoping identity derives the formula (and, recursively, the sum
    of any fixed power) instead of verifying a guess.

