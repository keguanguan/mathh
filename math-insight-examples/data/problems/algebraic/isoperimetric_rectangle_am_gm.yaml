id: isoperimetric_rectangle_am_gm

title: Among Rectangles of Given Perimeter the Square Has the Largest Area

aliases:
  - isoperimetric problem for rectangles
  - maximum area rectangle with fixed perimeter
  - AM-GM for rectangles

source:
  name: Wikipedia
