  - name: Engel - Problem-Solving Strategies
    url: https://link.springer.com/book/10.1007/b97682
    original_title: Chapter 8, The Induction Principle
    author: Arthur Engel

problem:
  statement: >
    Show that F_1 + F_2 + ... + F_n = F_{n+2} - 1 for the Fibonacci numbers.
  domain: algebra
  answer: proved

key_idea:
  name: "write each term as a difference: F_k = F_{k+2} - F_{k+1}"
  category: telescoping
  summary: >
    The recursion F_{k+2} = F_{k+1} + F_k says F_k = F_{k+2} - F_{k+1}.
    Summing from k = 1 to n telescopes: (F_3 - F_2) + (F_4 - F_3) + ... +
    (F_{n+2} - F_{n+1}) = F_{n+2} - F_2 = F_{n+2} - 1.

intuitive_proof:
  explanation: >
    By the defining recursion, F_k = F_{k+2} - F_{k+1} for every k. Summing
    over k = 1, ..., n, consecutive terms cancel and only F_{n+2} - F_2 =
    F_{n+2} - 1 survives. The same trick gives F_1 + F_3 + ... + F_{2n-1} =
    F_{2n} (use F_{2k-1} = F_{2k} - F_{2k-2}) and F_2 + F_4 + ... + F_{2n} =
    F_{2n+1} - 1.

reasoning_structure:
  naive_approach: >
    Verify the identity for small n and prove it by induction, which
    explains nothing.
  crucial_observation: >
    The recursion itself expresses each Fibonacci number as a difference of
    two later ones.
  why_it_simplifies: >
    Telescoping via the recursion proves a whole family of Fibonacci sum
    identities in one line each.

