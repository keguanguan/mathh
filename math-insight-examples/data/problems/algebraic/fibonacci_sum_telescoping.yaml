id: fibonacci_sum_telescoping

title: F_1 + F_2 + ... + F_n = F_{n+2} - 1

aliases:
  - sum of Fibonacci numbers
  - Fibonacci partial sums
  - telescoping with the Fibonacci recursion

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Fibonacci_sequence
  original_title: Fibonacci sequence (identities)
  accessed: 2026-09-16

