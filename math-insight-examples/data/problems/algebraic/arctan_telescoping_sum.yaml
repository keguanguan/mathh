id: arctan_telescoping_sum

title: A Telescoping Sum of Arctangents

aliases:
  - sum of arctan(1/(n^2+n+1))
  - arctan difference formula telescoping
  - arctan(1/2) + arctan(1/3) = pi/4

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 9, Sequences
  author: Arthur Engel
  accessed: 2026-09-16

