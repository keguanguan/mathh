  - flipping

quality:
  clarity_of_key_idea: high
  elegance: high
  naive_search_contrast: high
  pedagogical_value: high

familiarity:
  famous: true
  likely_widely_known: true

notes: >
  The general rule: with n objects and k flipped per move, all can be turned
  iff n is even or k is odd (and k <= n).
