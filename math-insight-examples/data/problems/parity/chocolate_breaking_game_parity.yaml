problem:
  statement: >
    Two players alternately break an m x n chocolate bar along a grid line
    (one piece per break). The player who makes the last break wins. Who
    wins?
  domain: combinatorial games
  answer: >
    the game always lasts mn - 1 breaks, so the first player wins iff mn is
    even

key_idea:
  name: every break increases the number of pieces by exactly one, so the length of the game is fixed
  category: parity_invariant
  summary: >
    Each break turns one piece into two, so the game ends after exactly mn -
    1 breaks no matter how anyone plays. The first player makes the
    odd-numbered breaks, so they make the last one iff mn - 1 is odd, i.e.
    iff mn is even.

intuitive_proof:
  explanation: >
    The number of pieces starts at 1, increases by exactly 1 per break, and
    the game ends at mn pieces: exactly mn - 1 breaks are made regardless of
    strategy. Breaks alternate between the players starting with the first,
    so the last break is the first player's iff mn - 1 is odd. There is no
    strategy at all; the outcome is fixed by the parity of mn.

reasoning_structure:
  naive_approach: >
    Analyse the game tree of breaking choices, which looks enormous.
  crucial_observation: >
    The move count is an invariant of the process, so the 'game' has no
    decisions that matter.
  why_it_simplifies: >
    A counting invariant collapses the game to a parity check.

