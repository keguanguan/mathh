id: eight_rooks_black_squares_even

title: Eight Non-Attacking Rooks Cover an Even Number of Black Squares

aliases:
  - rooks on black squares parity
  - non-attacking rooks colouring

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 2, Coloring Proofs
  author: Arthur Engel
  accessed: 2026-09-16

