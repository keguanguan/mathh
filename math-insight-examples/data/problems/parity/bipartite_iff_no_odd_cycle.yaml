id: bipartite_iff_no_odd_cycle

title: A Graph Is Bipartite Iff It Has No Odd Cycle

aliases:
  - bipartite characterisation
  - two-colourable iff no odd cycle
  - colour by parity of distance

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Bipartite_graph
