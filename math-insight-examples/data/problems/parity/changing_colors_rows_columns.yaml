quality:
  clarity_of_key_idea: high
  elegance: medium
  naive_search_contrast: high
  pedagogical_value: high

familiarity:
  famous: false
  likely_widely_known: true

notes: >
  For odd n the parity argument fails; Cut-the-Knot notes that a finer
  invariant is needed there (the puzzle is still unsolvable). A related
  invariant: the pattern "row i flipped xor column j flipped" means the
  4 corners of any rectangle are flipped an even number of times in total.
