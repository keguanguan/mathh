id: harmonic_sum_not_integer

title: 1 + 1/2 + ... + 1/n Is Never an Integer

aliases:
  - harmonic numbers are not integers
  - highest power of 2 argument
  - 2-adic valuation of harmonic sums

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 6, Number Theory
  author: Arthur Engel
  accessed: 2026-09-16

additional_sources:
  - name: Wikipedia
    url: https://en.wikipedia.org/wiki/Harmonic_number
    original_title: Harmonic number (properties)

problem:
  statement: >
    Show that for n >= 2 the sum 1 + 1/2 + 1/3 + ... + 1/n is not an
    integer.
  domain: number theory
  answer: proved

key_idea:
  name: exactly one denominator contains the highest power of 2 up to n
  category: extremal_principle
  summary: >
    Let 2^k be the largest power of 2 not exceeding n. It divides exactly
    one denominator, namely 2^k itself (2 * 2^k > n). Multiplying the sum by
    the odd number L = lcm(1..n)/2^k makes every term an integer except the
    term 1/2^k, which becomes L/2^k, not an integer.

intuitive_proof:
  explanation: >
    Let 2^k be the largest power of 2 with 2^k <= n; then k >= 1 and no
    other integer in 1..n is divisible by 2^k (the next candidate 2 * 2^k
    exceeds n, and odd multiples 3 * 2^k > n too). Let M = 2^{k-1} times the
    product of all odd numbers up to n. Then M * (1/m) is an integer for
    every m <= n except m = 2^k, for which M / 2^k is a half-integer. So M
    times the harmonic sum is an integer plus one half, not an integer;
    hence the harmonic sum is not an integer.

reasoning_structure:
  naive_approach: >
    Compute the sums as fractions for small n and observe the denominators,
    or try to show the denominator is even by induction.
  crucial_observation: >
    One term is 'extremal' in its power of 2 and cannot be cancelled by the
    others.
  why_it_simplifies: >
    Focusing on the unique term with maximal 2-adic content decides the
    question for all n at once.

tags:
  - extremal principle
  - 2-adic valuation
  - harmonic numbers
  - number theory

quality:
  clarity_of_key_idea: high
  elegance: high
