problem:
  statement: >
    Let a and b be positive integers such that ab + 1 divides a^2 + b^2.
    Show that (a^2 + b^2)/(ab + 1) is a perfect square.
  domain: number theory
  answer: proved

key_idea:
  name: from a minimal solution, Vieta's formulas produce a smaller one
  category: infinite_descent
  summary: >
    Fix the quotient k and take a solution (a, b) with a >= b and a + b
    minimal. Viewing a^2 - kb*a + (b^2 - k) = 0 as a quadratic in a, the
    other root a' = kb - a = (b^2 - k)/a is an integer, is smaller than a,
    and is non-negative; if a' > 0 then (a', b) is a smaller solution,
    contradiction, so a' = 0 and k = b^2.

intuitive_proof:
  explanation: >
    Suppose k = (a^2 + b^2)/(ab + 1) is a positive integer that is not a
    perfect square, and among all positive solutions (a, b) of
    a^2 + b^2 = k(ab + 1) pick one with a + b as small as possible, say
    a >= b. The equation is a quadratic in a: a^2 - (kb)a + (b^2 - k) = 0.
    By Vieta, its second root a' satisfies a + a' = kb and a*a' = b^2 - k,
    so a' is an integer. Since k is not a square, b^2 - k is nonzero, so
    a' is nonzero; and a'^2 + b^2 = k(a'b + 1) > 0 forces a' > 0
    (if a' < 0 the right side would be at most k(1 - b) <= 0 while the left
    is positive). Finally a' = (b^2 - k)/a < b^2/a <= a. So (a', b) is a
    positive solution with a' + b < a + b, contradicting minimality. Hence
    k must be a perfect square.

reasoning_structure:
  naive_approach: >
    Search for solutions numerically, or try to factor a^2 + b^2 modulo
    ab + 1; the divisibility condition resists direct algebraic attack.
  crucial_observation: >
    A solution is a root of a quadratic whose other root is also a
    solution, and that other root is smaller; minimality is violated unless
    the descent stops at zero.
  why_it_simplifies: >
    The extremal choice converts an intractable divisibility question into
    a two-line Vieta computation; the same descent solves a whole family of
    "quadratic Diophantine" olympiad problems.

