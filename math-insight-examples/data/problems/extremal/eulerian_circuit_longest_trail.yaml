id: eulerian_circuit_longest_trail

title: Even Degrees Imply an Eulerian Circuit (via a Longest Trail)

aliases:
  - Euler's theorem on Eulerian circuits
  - converse of the Konigsberg argument
  - maximal trail argument

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Eulerian_path
  original_title: Eulerian path (properties)
  accessed: 2026-09-16

