id: x2_y2_z2_2xyz_descent

title: x^2 + y^2 + z^2 = 2xyz Has Only the Trivial Solution

aliases:
  - Markov-type equation descent
  - sum of three squares equals twice product

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 6, Number Theory
  author: Arthur Engel
  accessed: 2026-09-16

