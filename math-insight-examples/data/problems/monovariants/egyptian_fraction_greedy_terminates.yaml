id: egyptian_fraction_greedy_terminates

title: Fibonacci's Greedy Algorithm for Egyptian Fractions Terminates

aliases:
  - Egyptian fractions greedy algorithm
  - Fibonacci-Sylvester algorithm
  - every fraction is a sum of distinct unit fractions

source:
