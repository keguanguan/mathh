  - local search
  - maximum cut

quality:
  clarity_of_key_idea: high
  elegance: high
  naive_search_contrast: high
  pedagogical_value: high

familiarity:
  famous: true
  likely_widely_known: true

notes: >
  The maximising division has at least half of all friendships crossing;
  compare the non-constructive probabilistic proof in
  bipartite_subgraph_half_edges.
