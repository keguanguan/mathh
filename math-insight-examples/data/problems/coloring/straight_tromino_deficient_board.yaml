id: straight_tromino_deficient_board

title: Which Square Can Be Removed So Straight Trominoes Tile the 8x8 Board?

aliases:
  - straight tromino tiling of a deficient chessboard
  - 1x3 tiles on 8x8 minus one square
  - Golomb straight tromino

