problem:
  statement: >
    Two diagonally opposite corner squares are removed from an ordinary 8x8
    chessboard, leaving 62 squares. Can the remaining board be tiled exactly
    by 31 dominoes, each covering two adjacent squares?
  domain: tiling
  answer: impossible

key_idea:
  name: checkerboard coloring
  category: coloring_invariant
  summary: >
    Every domino covers exactly one black and one white square, so any tiled
    region has equally many squares of each color. Two diagonally opposite
    corners have the same color, so the mutilated board does not.

intuitive_proof:
  explanation: >
    Color the board in the usual chessboard pattern. Wherever a domino lies,
    horizontally or vertically, it covers two adjacent squares, and adjacent
    squares always have different colors. Hence 31 dominoes cover exactly 31
    black and 31 white squares. But the two removed corners are the same
    color (both ends of a main diagonal), so the mutilated board has 32 squares
    of one color and 30 of the other. No tiling can exist.

reasoning_structure:
  naive_approach: >
    Start placing dominoes and search for an arrangement, or reason locally
    about which squares near the missing corners can be covered. The search
    space is enormous and local reasoning never yields a clean contradiction.
  crucial_observation: >
    A domino is color-balanced no matter where it is placed, so the only thing
    that matters about a region is the difference between its black and white
    counts.
  why_it_simplifies: >
    A single global count (32 versus 30) rules out every one of the
    astronomically many candidate arrangements at once; no case analysis is
    needed.

