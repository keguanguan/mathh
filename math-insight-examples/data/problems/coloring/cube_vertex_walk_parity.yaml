    original_title: Chapter on parity
    author: Dmitri Fomin, Sergey Genkin, Ilia Itenberg

problem:
  statement: >
    An ant walks along the edges of a cube from vertex to vertex. Show that
    it cannot return to its starting vertex after exactly 7 moves, and more
    generally after any odd number of moves.
  domain: graph theory
  answer: proved

key_idea:
  name: colour the vertices by the parity of their coordinate sum
  category: coloring_invariant
  summary: >
    Place the cube at {0,1}^3 and colour a vertex by the parity of x + y +
    z. Each edge joins vertices of opposite colour, so the colour alternates
    with every step; returning to the start needs an even number of steps.

intuitive_proof:
  explanation: >
    Coordinatise the vertices by triples in {0,1}^3. Moving along an edge
    changes exactly one coordinate, so the sum x + y + z changes parity at
    every step. After an odd number of steps the parity differs from the
    starting parity, so the ant is not at its starting vertex. The same
    holds for any hypercube and any bipartite graph.

reasoning_structure:
  naive_approach: >
    Enumerate walks of length 7 or search for a short odd cycle by trial.
  crucial_observation: >
    A two-colouring of the vertices with no monochromatic edge exists.
  why_it_simplifies: >
    Bipartiteness makes every closed walk even, with no enumeration.

