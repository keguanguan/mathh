quality:
  clarity_of_key_idea: high
  elegance: high
  naive_search_contrast: high
  pedagogical_value: high

familiarity:
  famous: true
  likely_widely_known: false

notes: >
  Open tours do exist on 4 x n boards for n >= 5, so the argument genuinely
  uses closure. An example of playing two invariants against each other.
