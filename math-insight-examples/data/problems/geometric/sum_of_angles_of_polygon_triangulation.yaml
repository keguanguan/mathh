id: sum_of_angles_of_polygon_triangulation

title: The Angle Sum of an n-gon by Triangulation from a Vertex

aliases:
  - polygon angle sum
  - (n - 2) times 180
  - fan triangulation

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Polygon
