id: orthocentre_reflection_circumcircle

title: The Reflection of the Orthocentre in a Side Lies on the Circumcircle

aliases:
  - orthocentre reflection
  - reflecting H across BC
  - orthocentre and circumcircle

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Altitude_%28triangle%29
