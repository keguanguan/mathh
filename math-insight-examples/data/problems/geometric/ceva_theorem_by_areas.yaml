id: ceva_theorem_by_areas

title: Ceva's Theorem by Ratios of Areas

aliases:
  - Ceva's theorem
  - concurrent cevians
  - area ratio proof of Ceva

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Ceva%27s_theorem
  original_title: Ceva's theorem (proof using areas)
  accessed: 2026-09-16

