id: pompeiu_theorem_rotation

title: Pompeiu's Theorem by Rotation

aliases:
  - Pompeiu's theorem
  - distances to vertices of an equilateral triangle form a triangle
  - 60 degree rotation

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Pompeiu%27s_theorem
  original_title: Pompeiu's theorem
  accessed: 2026-09-16

