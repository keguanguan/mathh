problem:
  statement: >
    Construct a square whose area is exactly twice that of a given square.
  domain: geometry
  answer: the square built on the diagonal of the given square

key_idea:
  name: the square on the diagonal is made of four half-squares, while the original square is made of two
  category: decomposition
  summary: >
    Draw a 2x2 array of copies of the given square and the tilted square
    whose sides are the diagonals of the four copies. Each copy is cut by
    its diagonal into two congruent right triangles; the tilted square
    consists of four such triangles and the original square of two, so the
    tilted square has twice the area.

intuitive_proof:
  explanation: >
    Place four copies of the given square in a 2x2 arrangement. In each copy
    draw the diagonal that borders the central region; these four diagonals
    form a tilted square S. Each diagonal cuts its copy into two congruent
    right triangles, one inside S and one outside, so S consists of exactly
    four of these triangles while the original square consists of two. Hence
    area(S) = 2 * area(original square), and S has side equal to the
    diagonal, i.e. side * sqrt 2.

reasoning_structure:
  naive_approach: >
    Try doubling the side, which quadruples the area, or search numerically
    for the right side length.
  crucial_observation: >
    Counting congruent triangles compares areas without any formula.
  why_it_simplifies: >
    A decomposition into equal pieces makes the factor 2 visible; the
    picture is a special case of the Pythagorean theorem and needs no
    algebra.

