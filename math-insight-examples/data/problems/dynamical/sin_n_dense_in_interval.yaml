id: sin_n_dense_in_interval

title: The Values sin 1, sin 2, sin 3, ... Are Dense in [-1, 1]

aliases:
  - sin n dense
  - integers mod 2 pi are dense
  - irrational rotation by one radian

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Equidistribution_theorem
  original_title: Equidistribution theorem (applications)
  accessed: 2026-09-16

