id: benford_leading_digits_powers_of_two

title: Benford's Law for Powers of Two via Rotation of the Circle

aliases:
  - Benford's law for 2^n
  - leading digit of powers of two
  - first-digit law
  - equidistribution of n log 2 mod 1

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Benford%27s_law
  original_title: Benford's law
  accessed: 2026-09-16
  notes: >
    The circle-rotation explanation for geometric sequences goes back to the
    equidistribution theorem of Weyl (1909/1916); Benford's 1938 paper
    and Newcomb's 1881 note observed the law empirically.

additional_sources:
  - name: Wikipedia
