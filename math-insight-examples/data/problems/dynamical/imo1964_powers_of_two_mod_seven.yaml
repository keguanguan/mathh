    original_title: Modular exponentiation

problem:
  statement: >
    Find all positive integers n for which 2^n - 1 is divisible by 7, and
    show that 2^n + 1 is never divisible by 7.
  domain: number theory
  answer: >
    2^n - 1 is divisible by 7 iff n is a multiple of 3; 2^n + 1 never is

key_idea:
  name: "powers of 2 modulo 7 cycle with period 3: 2, 4, 1"
  category: finite_state_periodicity
  summary: >
    2^1, 2^2, 2^3 are 2, 4, 1 mod 7, and 2^3 = 1 means the pattern repeats
    with period 3. So 2^n = 1 mod 7 iff 3 | n, and 2^n is never -1 = 6 mod
    7.

intuitive_proof:
  explanation: >
    Since 2^3 = 8 = 1 mod 7, we have 2^{3k + r} = (2^3)^k 2^r = 2^r mod 7.
    So 2^n mod 7 is 1, 2 or 4 according as n = 0, 1 or 2 mod 3. Hence 7
    divides 2^n - 1 exactly when n = 0 mod 3. And 2^n + 1 mod 7 is 2, 3 or
    5, never 0.

reasoning_structure:
  naive_approach: >
    Compute 2^n - 1 for small n and test divisibility, guessing the pattern
    without proof.
  crucial_observation: >
    Residues of powers form a periodic orbit, and the period (3) is found by
    locating the first return to 1.
  why_it_simplifies: >
    Periodicity reduces infinitely many cases to three residues.

