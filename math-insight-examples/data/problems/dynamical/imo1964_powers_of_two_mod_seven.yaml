id: imo1964_powers_of_two_mod_seven

title: 2^n - 1 Is Divisible by 7 Exactly When 3 Divides n (IMO 1964 Problem 1)

aliases:
  - IMO 1964 problem 1
  - 2^n mod 7
  - 2^n + 1 never divisible by 7

