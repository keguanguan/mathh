id: kaprekar_6174_attractor

title: Kaprekar's Routine Always Reaches 6174

aliases:
  - Kaprekar's constant
  - "6174"
  - Kaprekar routine on four-digit numbers

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/6174
  original_title: "6174"
  accessed: 2026-09-16

additional_sources:
  - name: Kaprekar - An interesting property of the number 6174
    notes: Scripta Mathematica, 1955

problem:
  statement: >
    Take any four-digit number with at least two distinct digits, arrange
    its digits in decreasing and in increasing order, and subtract the
    smaller from the larger. Show that repeating this reaches 6174 within at
    most 7 steps, and that 6174 is fixed.
  domain: number theory / dynamical systems
  answer: >
    every starting number reaches the fixed point 6174 in at most 7
    iterations

key_idea:
  name: the result of one step depends only on the multiset of digits, and only on the three digit differences; this collapses 10,000 starting values to a few dozen states of a finite dynamical system whose only cycle is the fixed point 6174
  category: attracting_structure
  summary: >
    With sorted digits a >= b >= c >= d, one step gives 999(a - d) + 90(b -
    c), which depends only on two digit gaps: at most 54 values are possible
    after the first step. The routine is thus a dynamical system on a finite
    set, so every orbit eventually cycles, and a short table shows the only
    cycle is the fixed point 7641 - 1467 = 6174, reached within 7 steps.

intuitive_proof:
  explanation: >
    Write the sorted digits as a >= b >= c >= d (not all equal). The
    Kaprekar step computes (1000a + 100b + 10c + d) - (1000d + 100c + 10b +
    a) = 999(a - d) + 90(b - c). Hence the result depends only on the two
    gaps a - d (from 1 to 9) and b - c (from 0 to 9, with b - c <= a - d),
    giving at most 54 possible results, all multiples of 9. The map from the
    set of these results to itself is a deterministic dynamical system on a
    finite set, so every orbit is eventually periodic. Enumerating the 54
    cases (a short table) shows that every orbit reaches 6174 = 999 * 7 + 90
    * 3, which is fixed since 7641 - 1467 = 6174, and that no other cycle
    exists; the longest transient is 7 steps (for example 1000 -> 0999 ->
    8991 -> 8082 -> 8532 -> 6174 takes 5 steps, keeping leading zeros). For
    three-digit numbers the analogous constant is 495; for other lengths
    there are several cycles.

reasoning_structure:
  naive_approach: >
    Test many numbers by hand and be surprised that they all end at 6174,
    without an explanation.
  crucial_observation: >
    The step only sees digit gaps, so the effective state space is tiny and
    the dynamics can be exhausted; finiteness guarantees eventual
    periodicity and the table shows the unique attractor.
  why_it_simplifies: >
    Reducing to a finite dynamical system on 54 states turns an apparently
    magical property into a finite check.

