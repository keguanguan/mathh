notes: >
  The orbit is attracted to the fixed point 0 for any 2^k numbers; for
  other lengths (e.g. 3) the sequence (1, 1, 0) -> (0, 1, 1) -> (1, 0, 1)
  cycles. A nice example where a mod-2 invariant and a monovariant work
  together.
