id: sum_of_two_odd_squares_not_square

title: The Sum of Two Odd Squares Is Never a Square

aliases:
  - two odd squares
  - a^2 + b^2 with a, b odd
  - squares mod 4 again

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 6, Number Theory
  author: Arthur Engel
  accessed: 2026-09-16

additional_sources:
  - name: Wikipedia
    url: https://en.wikipedia.org/wiki/Modular_arithmetic
    original_title: Modular arithmetic (applications)

problem:
  statement: >
    Show that if a and b are odd integers then a^2 + b^2 is not a perfect
    square; equivalently, in a Pythagorean triple the two legs cannot both
    be odd.
  domain: number theory
  answer: proved

key_idea:
  name: odd squares are 1 mod 4, so the sum is 2 mod 4, but squares are 0 or 1 mod 4
  category: modular_invariant
  summary: >
    (2m + 1)^2 = 4m(m + 1) + 1 = 1 mod 4 (in fact mod 8). Two odd squares
    sum to 2 mod 4, and no square is 2 mod 4.

intuitive_proof:
  explanation: >
    An odd number 2m + 1 has square 4m^2 + 4m + 1 = 1 mod 4. So if a and b
    are odd, a^2 + b^2 = 2 mod 4. But every square is 0 mod 4 (even base) or
    1 mod 4 (odd base). Hence a^2 + b^2 is not a square. In a Pythagorean
    triple a^2 + b^2 = c^2 one leg must therefore be even.

reasoning_structure:
  naive_approach: >
    Search for a counterexample among small odd numbers.
  crucial_observation: >
    Modulo 4 the equation is impossible.
  why_it_simplifies: >
    A two-value residue table for squares settles the question instantly; it
    is the first step in the classification of Pythagorean triples.

