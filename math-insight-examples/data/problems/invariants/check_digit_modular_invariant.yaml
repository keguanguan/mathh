problem:
  statement: >
    A UPC barcode d_1 ... d_12 satisfies 3(d_1 + d_3 + ... + d_11) + (d_2 +
    d_4 + ... + d_12) = 0 mod 10. Show that changing any single digit
    produces an invalid code, and explain which adjacent transpositions go
    undetected. Show that the ISBN-10 rule sum of i * d_i = 0 mod 11 detects
    all single errors and all adjacent transpositions.
  domain: number theory
  answer: proved

key_idea:
  name: a single change alters the weighted sum by w * (d' - d) with weight w = 1 or 3, which is nonzero mod 10 since w is coprime to 10 and |d' - d| < 10; transpositions change it by 2(d - d'), invisible when d - d' = 5
  category: modular_invariant
  summary: >
    A valid code has weighted sum 0 mod 10. Changing one digit changes the
    sum by w(d' - d) with w in {1, 3} coprime to 10 and 0 < |d' - d| < 10,
    so the sum leaves 0 mod 10: detected. Swapping adjacent digits changes
    it by 2(d - d'), invisible exactly when the digits differ by 5. With the
    prime modulus 11 and weights 1..10 (ISBN-10) both kinds of error are
    always detected.

intuitive_proof:
  explanation: >
    UPC: the weighted sum S = sum of w_i d_i with w_i alternating 3, 1 is 0
    mod 10 for a valid code. A single error at position i changes S by w_i
    (d_i' - d_i). Since gcd(w_i, 10) = 1 and 1 <= |d_i' - d_i| <= 9, this
    change is not divisible by 10, so S becomes nonzero mod 10: detected.
    Swapping adjacent digits a, b (weights 3, 1 in some order) changes S by
    (3a + b) - (3b + a) = 2(a - b), which is 0 mod 10 iff a - b = 0 or +-5;
    so transpositions of digits differing by 5 escape. ISBN-10: S = sum of i
    d_i over i = 1..10 is 0 mod 11. A single error changes S by i (d' - d)
    with 1 <= i <= 10 and 1 <= |d' - d| <= 10 (the check symbol X counts as
    10), a product of two numbers not divisible by the prime 11, hence
    nonzero mod 11. Swapping adjacent digits a, b at positions i, i + 1
    changes S by (i + 1)a + i b - i a - (i + 1) b = a - b, nonzero mod 11
    whenever a != b. So all such errors are detected.

reasoning_structure:
  naive_approach: >
    Test many corrupted codes against the rule and observe they fail,
    without understanding which errors slip through.
  crucial_observation: >
    The checksum is a linear form; an error is detected iff it changes the
    form by an amount not divisible by the modulus, which is a question
    about the weights being coprime to the modulus.
  why_it_simplifies: >
    A modular invariant with well-chosen weights turns error detection into
    a divisibility statement; a prime modulus (ISBN) catches transpositions
    that a composite one (UPC) misses.

