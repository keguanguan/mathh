id: check_digit_modular_invariant

title: Check Digits Detect Every Single-Digit Error

aliases:
  - UPC check digit
  - ISBN check digit
  - barcode error detection
  - weighted sum mod 10 or 11

source:
  name: Cut-the-Knot
