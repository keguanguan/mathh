id: squares_mod_four_obstruction

title: Sums of Two Squares Are Never 3 mod 4

aliases:
  - squares mod 4
  - x^2 + y^2 = 4k + 3 impossible
  - modular obstruction to squares

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
  original_title: Chapter 6, Number Theory
  author: Arthur Engel
  accessed: 2026-09-16

additional_sources:
  - name: Wikipedia
    url: https://en.wikipedia.org/wiki/Modular_arithmetic
    original_title: Modular arithmetic (applications)

problem:
  statement: >
    Show that no number of the form 4k + 3 is a sum of two integer squares.
    Show also that x^2 - y^2 = 2 has no integer solutions, and that a
    perfect square cannot end in the digit 2, 3, 7 or 8.
  domain: number theory
  answer: proved

key_idea:
  name: reduce modulo a small modulus where squares take few values
  category: modular_invariant
  summary: >
    Squares are 0 or 1 mod 4, so a sum of two squares is 0, 1 or 2 mod 4,
    never 3. Differences of squares are 0, 1 or 3 mod 4, never 2. Modulo 10
    the squares end in 0, 1, 4, 5, 6, 9 only.

intuitive_proof:
  explanation: >
    An even number 2m squares to 4m^2 = 0 mod 4; an odd number 2m + 1
    squares to 4m^2 + 4m + 1 = 1 mod 4. So x^2 + y^2 mod 4 is in {0, 1, 2}
    and can never be 3. Likewise x^2 - y^2 mod 4 is in {0, 1, -1} = {0, 1,
    3}, never 2. For the last digit, square the ten residues mod 10: 0, 1,
    4, 9, 6, 5, 6, 9, 4, 1, so 2, 3, 7, 8 never occur.

reasoning_structure:
  naive_approach: >
    Try to solve the equations or look for a factorisation such as x^2 - y^2
    = (x - y)(x + y) (which does work for the second claim but not the
    first).
  crucial_observation: >
    Squares occupy only a few residue classes, so a residue check can rule
    out an equation outright.
  why_it_simplifies: >
    A finite table settles infinitely many cases; 'reduce mod something
    small' is the first tool for showing a Diophantine equation has no
    solutions.

