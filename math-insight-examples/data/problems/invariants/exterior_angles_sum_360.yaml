id: exterior_angles_sum_360

title: The Exterior Angles of a Convex Polygon Sum to 360 Degrees

aliases:
  - exterior angle sum
  - walking around a polygon
  - turning angle

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Internal_and_external_angles
  original_title: Internal and external angles (sum of exterior angles)
  accessed: 2026-09-16

