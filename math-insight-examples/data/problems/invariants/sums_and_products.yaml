notes: >
  The generalisation: any rule of the form f^{-1}(f(a) * f(b)) for a
  bijection f and an associative commutative operation * gives an
  order-independent outcome (see the "1-1 functions" follow-up on
  Cut-the-Knot). Compare sums_and_products with breaking_chocolate, where
  the invariant is additive.
