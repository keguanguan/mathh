  url: https://www.imo-official.org/problems.aspx
  original_title: IMO 1975 Problem 4
  accessed: 2026-09-16
  notes: A standard example of the "digit sum is congruent to the number mod 9" invariant.

additional_sources:
  - name: Wikipedia
