id: digit_sum_iteration_imo1975

title: Iterated Digit Sums of 4444^4444 (IMO 1975 Problem 4)

aliases:
  - IMO 1975 problem 4
  - digital root of 4444^4444
  - sum of digits of the sum of digits

source:
