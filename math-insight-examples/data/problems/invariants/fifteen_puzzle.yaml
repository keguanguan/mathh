problem:
  statement: >
    Fifteen numbered tiles sit in a 4x4 frame with one empty cell. A move
    slides a tile adjacent to the empty cell into it. Starting from the
    ordered arrangement 1, 2, ..., 15 with the blank in the bottom-right
    corner, can one reach the arrangement in which only tiles 14 and 15 are
    swapped (blank again bottom-right)?
  domain: combinatorics
  answer: impossible

key_idea:
  name: parity of the permutation, corrected by the blank's position
  category: permutation_invariant
  summary: >
    Treat the blank as a 16th tile. Each move is a transposition of the blank
    with a neighbour, so it flips the sign of the permutation and changes the
    blank's taxicab distance from its home corner by one. The product
    sign x (-1)^distance is therefore invariant; swapping 14 and 15 alone
    changes it.

intuitive_proof:
  explanation: >
    Read the 16 cells (blank included) row by row as a permutation of
    1..16. A move swaps the blank with one adjacent tile: this is a single
    transposition, so the sign of the permutation flips at every move. At the
    same time the blank moves one step, so its taxicab distance from the
    bottom-right corner changes by exactly one, and the parity of that
    distance also flips at every move. Hence the quantity
    sign(permutation) x (-1)^(blank distance) never changes. In the start
    position it equals +1. In the target position the blank is home (distance
    0) but the permutation is a single transposition (14 15), of sign -1. The
    invariant would have to change, so the target is unreachable.

reasoning_structure:
  naive_approach: >
    Try sequences of slides, or run a computer search over the
    16!/2 ~ 10^13 reachable positions, hoping either to find a solution or to
    exhaust the state space.
  crucial_observation: >
    Every move is a transposition, so it acts on a global, easily computed
    label (the sign of the permutation) in a completely predictable way.
  why_it_simplifies: >
    Reachability of any configuration is decided by evaluating one +-1 label
    instead of exploring the state graph; the argument also shows that exactly
    half of all arrangements are reachable.

