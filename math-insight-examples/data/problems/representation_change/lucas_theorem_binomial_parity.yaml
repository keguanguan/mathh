id: lucas_theorem_binomial_parity

title: C(n, k) Is Odd Exactly When the Binary Digits of k Are Contained in Those of n

aliases:
  - Lucas's theorem mod 2
  - parity of binomial coefficients
  - Sierpinski triangle in Pascal's triangle
  - Kummer's theorem

