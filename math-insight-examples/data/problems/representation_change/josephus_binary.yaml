id: josephus_binary

title: The Josephus Problem in Binary

aliases:
  - Josephus problem
  - Josephus Flavius game
  - every second person eliminated in a circle
  - cyclic shift of the binary representation

source:
  name: Cut-the-Knot
  url: https://www.cut-the-knot.org/recurrence/flavius.shtml
  original_title: Josephus Flavius game
  author: Alexander Bogomolny
  accessed: 2026-09-16
  notes: Bogomolny follows Graham, Knuth and Patashnik, Concrete Mathematics, Section 1.3.

additional_sources:
  - name: Graham, Knuth, Patashnik - Concrete Mathematics
    notes: Section 1.3, "The Josephus Problem".
  - name: Wikipedia
    url: https://en.wikipedia.org/wiki/Josephus_problem
    original_title: Josephus problem

problem:
  statement: >
    n people stand in a circle numbered 1 to n. Going around the circle,
    every second person is eliminated (2 goes first, then 4, ...) until one
    remains. Which position survives?
  domain: combinatorics
  answer: >
    Write n in binary and move its leading 1 to the end: J(n) = 2L + 1 where
    n = 2^m + L with 0 <= L < 2^m.

key_idea:
  name: after one full round the problem is a smaller copy of itself with relabelled positions
  category: algebraic_encoding
  summary: >
    Eliminating every second person from 2n people leaves the odd positions,
    which form the same game with n people; person k of the new game was
    person 2k - 1. So J(2n) = 2J(n) - 1 and J(2n+1) = 2J(n) + 1, which in
    binary is exactly "rotate the leading bit to the end".

intuitive_proof:
  explanation: >
    With 2n people, the first pass removes 2, 4, ..., 2n and leaves
    1, 3, ..., 2n - 1, starting again from 1; this is the n-person game
    with person k renamed 2k - 1, so J(2n) = 2J(n) - 1. With 2n + 1 people
    the first pass also removes person 1 (after 2n), leaving 3, 5, ...,
    2n + 1 starting from 3, so person k is renamed 2k + 1 and
    J(2n + 1) = 2J(n) + 1. Both recurrences say: J of a number is obtained
    from J of the number with its last bit dropped by appending that same
    bit, except for the leading 1 which becomes a trailing 1. Starting from
    J(1) = 1, this yields J(n) = the binary string of n rotated one place to
    the left.

reasoning_structure:
  naive_approach: >
    Simulate the elimination for many n and search for a pattern in the
    table of survivors, or set up a recurrence and solve it by unrolling.
  crucial_observation: >
    One round of elimination reproduces the same game on half as many
    people with a linear renaming, and that renaming acts on the binary
    representation by appending a bit.
  why_it_simplifies: >
    The recurrence becomes a statement about binary digits, so the survivor
    is read off from the binary expansion of n with no computation.

