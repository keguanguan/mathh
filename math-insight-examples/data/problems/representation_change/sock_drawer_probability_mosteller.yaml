id: sock_drawer_probability_mosteller

title: "The Sock Drawer: Two Red Socks with Probability Exactly 1/2"

aliases:
  - sock drawer problem
  - Mosteller's sock problem
  - probability of two red socks is one half

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Pell%27s_equation
  original_title: Pell's equation (example)
  accessed: 2026-09-16
  notes: >
    The problem is Problem 1 of Mosteller's Fifty Challenging Problems in
    Probability; the Wikipedia page covers the Pell equation used in the
