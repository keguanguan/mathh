id: brahmagupta_fibonacci_identity

title: Products of Sums of Two Squares Are Sums of Two Squares

aliases:
  - Brahmagupta-Fibonacci identity
  - (a^2+b^2)(c^2+d^2) as a sum of two squares
  - multiplicativity of the norm

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Brahmagupta%E2%80%93Fibonacci_identity
  original_title: Brahmagupta–Fibonacci identity
  accessed: 2026-09-16

