problem:
  statement: >
    Let p be prime and a a positive integer. Show that p divides a^p - a.
  domain: number theory
  answer: proved

key_idea:
  name: a^p - a counts strings of p beads in a colours that are not constant, and rotation groups them into orbits of size exactly p
  category: combinatorial_interpretation
  summary: >
    There are a^p strings of p beads coloured with a colours, of which a
    are constant. Rotating a non-constant string gives p distinct strings
    (because p is prime, a string cannot have a period strictly between 1
    and p). So the a^p - a non-constant strings fall into orbits of size
    p, and p divides a^p - a.

intuitive_proof:
  explanation: >
    Consider all a^p sequences of length p over a colours, and let the
    cyclic group of rotations act on them. A sequence fixed by a rotation
    by k positions (0 < k < p) has period gcd(k, p) = 1, so it is constant.
    Hence every non-constant sequence has an orbit of exactly p distinct
    rotations. The a^p - a non-constant sequences are partitioned into
    orbits of size p, which means p divides a^p - a. (Each orbit is one
    necklace, hence the name.)

reasoning_structure:
  naive_approach: >
    Prove the theorem by induction on a using the binomial theorem and the
    fact that p divides C(p, k) for 0 < k < p, or via the group of units mod
    p.
  crucial_observation: >
    a^p - a is the size of a set, and that set carries a free action of a
    group of prime order p.
  why_it_simplifies: >
    Divisibility by p becomes "the set splits into orbits of size p",
    visible at once; no algebra is needed and the proof explains why
    primality matters.

