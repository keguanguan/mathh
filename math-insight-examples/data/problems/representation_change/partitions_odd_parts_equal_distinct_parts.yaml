problem:
  statement: >
    Show that the number of ways to write n as a sum of odd positive
    integers (order irrelevant) equals the number of ways to write n as a
    sum of distinct positive integers.
  domain: combinatorics
  answer: proved

key_idea:
  name: "compare generating functions: product of 1/(1 - x^{odd}) versus product of (1 + x^k), and use 1 + x^k = (1 - x^{2k})/(1 - x^k)"
  category: generating_function
  summary: >
    The generating function for distinct parts is the product over k of (1 +
    x^k) = product of (1 - x^{2k})/(1 - x^k). Every factor 1 - x^{2k} in the
    numerator cancels the factor 1 - x^{2k} in the denominator, leaving
    product over odd m of 1/(1 - x^m), the generating function for odd
    parts.

intuitive_proof:
  explanation: >
    Partitions of n into distinct parts are counted by the coefficient of
    x^n in product over k >= 1 of (1 + x^k), since each k is used 0 or 1
    times. Partitions into odd parts are counted by the coefficient in
    product over odd m of (1 + x^m + x^{2m} + ...) = product over odd m of
    1/(1 - x^m). Now 1 + x^k = (1 - x^{2k})/(1 - x^k), so product of (1 +
    x^k) = product of (1 - x^{2k}) / product of (1 - x^k). The numerator is
    the product of (1 - x^j) over even j, which cancels exactly the
    even-indexed factors of the denominator, leaving product over odd m of
    1/(1 - x^m). Equal generating functions mean equal coefficients.

reasoning_structure:
  naive_approach: >
    Compare the two counts for small n (they agree: 1, 1, 2, 2, 3, 4, 5,
    ...) and look for a bijection, which is not obvious (Glaisher's: split
    each even part in half repeatedly).
  crucial_observation: >
    Encoding partitions as coefficients of products turns the statement into
    a one-line algebraic cancellation.
  why_it_simplifies: >
    Generating functions make a non-obvious bijective statement into a
    two-line identity of products.

