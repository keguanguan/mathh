id: partitions_odd_parts_equal_distinct_parts

title: Partitions into Odd Parts and into Distinct Parts (Euler)

aliases:
  - Euler's partition identity
  - odd parts equal distinct parts
  - Glaisher's bijection

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Partition_%28number_theory%29
  original_title: Partition (number theory) (odd parts and distinct parts)
  accessed: 2026-09-16

additional_sources:
  - name: Aigner & Ziegler - Proofs from THE BOOK
    url: https://link.springer.com/book/10.1007/978-3-662-57265-8
    original_title: Chapter on partitions / generating functions
    author: Martin Aigner, Gunter M. Ziegler
