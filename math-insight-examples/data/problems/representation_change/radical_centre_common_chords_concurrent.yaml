id: radical_centre_common_chords_concurrent

title: The Three Common Chords of Three Intersecting Circles Are Concurrent

aliases:
  - radical centre
  - common chords concurrent
  - radical axes meet at a point

source:
  name: Cut-the-Knot
  url: https://www.cut-the-knot.org/proofs/circlesAndSpheres.shtml
  original_title: Three Circles and Common Chords
  author: Alexander Bogomolny
  accessed: 2026-09-16

additional_sources:
  - name: Wikipedia
    url: https://en.wikipedia.org/wiki/Radical_axis
    original_title: Radical axis (radical center)

problem:
  statement: >
    Three circles intersect pairwise. Show that the three common chords
    (extended if necessary) pass through a single point.
  domain: geometry
  answer: proved

key_idea:
  name: the common chord of two circles is the set of points with equal power with respect to both; a point on two of the chords has equal power with respect to all three circles, so it lies on the third chord
  category: algebraic_encoding
  summary: >
    The common chord of circles 1 and 2 is their radical axis: the locus
    where the powers with respect to the two circles agree (both are 0 at
    the intersection points and the locus is a line). Let X be the
    intersection of the chords of (1, 2) and (2, 3). Then power_1(X) =
    power_2(X) = power_3(X), so X is also on the radical axis of (1, 3),
    i.e. on the third chord.

intuitive_proof:
  explanation: >
    For a circle with centre O and radius r, the power of a point P is OP^2
    - r^2, an expression of the form x^2 + y^2 + (linear terms) in
    coordinates. The points where two circles have equal power form a line,
    since the quadratic parts cancel; the two intersection points of the
    circles have power 0 with respect to both, so this line is the line of
    the common chord. Let X be the intersection of the chords of circles 1,
    2 and of circles 2, 3 (these lines are not parallel, being perpendicular
    to the two non-parallel lines of centres). Then p_1(X) = p_2(X) and
    p_2(X) = p_3(X), hence p_1(X) = p_3(X), and X lies on the radical axis
    of circles 1 and 3, which is their common chord. So the three chords
    concur at X, the radical centre.

reasoning_structure:
  naive_approach: >
    Use coordinates for the three circles and solve for the intersection
    points of the chords.
  crucial_observation: >
    Common chords are level sets of differences of power functions, and
    'equal to the second and the second equal to the third' gives the third
    equality for free.
  why_it_simplifies: >
    Encoding chords as radical axes turns concurrency into transitivity of
    equality.

