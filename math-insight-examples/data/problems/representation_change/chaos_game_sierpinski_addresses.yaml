id: chaos_game_sierpinski_addresses

title: Why the Chaos Game Draws the Sierpinski Triangle

aliases:
  - chaos game
  - Sierpinski triangle by random iteration
  - addresses in the Sierpinski gasket

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Chaos_game
