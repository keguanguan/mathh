id: proizvolov_identity

title: Proizvolov's Identity

aliases:
  - Proizvolov's identity
  - sum of |a_i - b_i| = n^2
  - split 1..2n into two sorted halves

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Proizvolov%27s_identity
  original_title: Proizvolov's identity
  accessed: 2026-09-16

additional_sources:
  - name: Cut-the-Knot
    url: https://www.cut-the-knot.org/Curriculum/Games/ProizvolovGame.shtml
