    url: https://link.springer.com/book/10.1007/b97682
    original_title: Chapter 6, Number Theory
    author: Arthur Engel

problem:
  statement: >
    Show that a positive integer n has an odd number of positive divisors if
    and only if n is a perfect square.
  domain: number theory
  answer: proved

key_idea:
  name: pair each divisor d with n/d; the pairing is an involution whose only possible fixed point is sqrt(n)
  category: involution_parity
  summary: >
    The map d -> n/d pairs the divisors of n. A divisor is paired with
    itself only when d = n/d, i.e. d^2 = n. So the divisors come in pairs,
    plus one unpaired divisor exactly when n is a square.

intuitive_proof:
  explanation: >
    For each divisor d of n, n/d is also a divisor, and the map d -> n/d is
    an involution on the set of divisors. Non-fixed elements are matched in
    pairs, so the number of divisors has the same parity as the number of
    fixed points. A fixed point satisfies d = n/d, i.e. d = sqrt(n), which
    exists (and is unique) iff n is a perfect square. Hence the divisor
    count is odd iff n is a square.

reasoning_structure:
  naive_approach: >
    Use the formula for the number of divisors, product of (e_i + 1), and
    note it is odd iff all e_i are even.
  crucial_observation: >
    Divisors pair up naturally, and the parity of a set with an involution
    is the parity of its fixed points.
  why_it_simplifies: >
    The involution argument needs no formula and explains the phenomenon; it
    is the key to the locker puzzle.

