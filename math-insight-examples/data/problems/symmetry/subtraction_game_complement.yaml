problem:
  statement: >
    A pile has n counters. Players alternately remove between 1 and k
    counters. Whoever takes the last counter wins. Who wins, and how?
  domain: combinatorial games
  answer: >
    The player to move loses if and only if n is a multiple of k + 1;
    otherwise they win by moving to a multiple of k + 1 and thereafter
    answering each removal of m with a removal of k + 1 - m.

key_idea:
  name: pair the moves so that each round removes exactly k + 1 counters
  category: pairing_strategy
  summary: >
    Whatever m in 1..k the opponent takes, reply with k + 1 - m, which is
    also in 1..k. Each pair of moves removes exactly k + 1 counters, so from
    a multiple of k + 1 the replying player always faces a multiple of k + 1
    and eventually takes the last counter.

intuitive_proof:
  explanation: >
    Call n "safe" if k + 1 divides n. From a safe position any move
    removes m with 1 <= m <= k and lands on a non-safe position. From a
    non-safe position the player can remove n mod (k + 1), which lies in
    1..k, landing on a safe position. Since 0 is safe and is a loss for the
    player to move, safe positions are exactly the losing ones. The winning
    strategy is the pairing: after reaching a multiple of k + 1, answer
    each m by k + 1 - m, so the pile shrinks by exactly k + 1 per round.

reasoning_structure:
  naive_approach: >
    Compute winning and losing positions backwards from 0 for specific k
    and notice the period k + 1, then argue by induction.
  crucial_observation: >
    Moves can be paired into rounds of fixed total size, so the pile
    counts down in steps of k + 1 regardless of the opponent.
  why_it_simplifies: >
    One pairing rule replaces the whole game tree and works for every n
    and k at once.

