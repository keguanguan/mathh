id: nine_coins_two_weighings_ternary

title: Finding One Heavy Coin among Nine with Two Weighings

aliases:
  - nine coins two weighings
  - ternary search with a balance
  - heavier coin puzzle

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Balance_puzzle
  original_title: Balance puzzle
  accessed: 2026-09-16

additional_sources:
  - name: Cut-the-Knot
    url: https://www.cut-the-knot.org/blue/weight1.shtml
    original_title: Weighing 12 coins, an Odd Ball puzzle
    author: Alexander Bogomolny

problem:
  statement: >
    Nine coins look alike, but one is slightly heavier. With a balance scale
    and two weighings, find the heavy coin. Explain why nine is the most
    that two weighings can handle.
  domain: combinatorics
  answer: >
    split into three groups of three; weigh two groups against each other to
    find the heavy group, then weigh two of its coins

key_idea:
  name: each weighing has three outcomes, so it should split the candidates into three equal parts
  category: information_counting_bound
  summary: >
    Weigh three coins against three others: if they balance the heavy coin
    is among the remaining three, otherwise it is on the heavier pan. Then
    weigh one coin of the identified triple against another: balance means
    the third is heavy. Two weighings distinguish at most 3^2 = 9 cases, so
    nine coins is the maximum.

intuitive_proof:
  explanation: >
    First weighing: coins 1-3 versus coins 4-6. If the pans balance, the
    heavy coin is among 7-9; otherwise it is in the heavier group. Second
    weighing within the identified group of three: weigh one coin against
    another; the heavier pan shows the heavy coin, and balance means it is
    the third coin. Optimality: a weighing has three outcomes, so k
    weighings produce at most 3^k distinct outcome sequences, and each of
    the n coins must correspond to a distinct sequence; hence n <= 9 for two
    weighings.

reasoning_structure:
  naive_approach: >
    Split the coins in half, which wastes the third outcome (balance) and
    needs four weighings for nine coins.
  crucial_observation: >
    A balance answers a three-way question, so candidates should be split
    into three groups, not two.
  why_it_simplifies: >
    Matching the search to the information per step gives the optimal
    strategy and the proof of optimality in one stroke.

