problem:
  statement: >
    Two chords AB and CD of a circle meet at a point P inside the circle.
    Show that PA * PB = PC * PD.
  domain: geometry
  answer: proved

key_idea:
  name: "draw AC and BD: the triangles PAC and PDB are similar by the inscribed angle theorem"
  category: auxiliary_object
  summary: >
    Join A to C and B to D. Angles PAC and PDB are inscribed angles on the
    same arc CB, hence equal; angles APC and DPB are vertical angles. So
    triangles PAC and PDB are similar, giving PA/PD = PC/PB, i.e. PA * PB =
    PC * PD.

intuitive_proof:
  explanation: >
    Draw the segments AC and BD. The inscribed angles CAB and CDB subtend
    the same arc CB, so angle PAC = angle PDB. The angles at P are
    vertically opposite, so angle APC = angle DPB. Hence triangles APC and
    DPB are similar (two angles), and corresponding sides are proportional:
    PA/PD = PC/PB. Cross-multiplying gives PA * PB = PC * PD. The same
    argument with P outside the circle proves the power-of-a-point theorem
    for secants.

reasoning_structure:
  naive_approach: >
    Use coordinates for the circle and the chords and expand.
  crucial_observation: >
    Two auxiliary segments create a pair of similar triangles whose
    proportion is exactly the claim.
  why_it_simplifies: >
    The inscribed angle theorem supplies the similarity, and the product
    formula is its cross-multiplied form; the same picture defines the power
    of a point.

