  - forward-backward induction
  - AM-GM for n variables

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Inequality_of_arithmetic_and_geometric_means
  original_title: Inequality of arithmetic and geometric means (proof by Cauchy using forward-backward induction)
  accessed: 2026-09-16

