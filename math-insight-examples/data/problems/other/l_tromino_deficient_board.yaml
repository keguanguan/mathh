id: l_tromino_deficient_board

title: Tiling a Deficient 2^n x 2^n Board with L-Trominoes (Golomb)

aliases:
  - Golomb's tromino theorem
  - deficient chessboard tromino tiling
  - L-tromino tiling by induction

