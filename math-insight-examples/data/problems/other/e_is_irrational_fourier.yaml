id: e_is_irrational_fourier

title: e Is Irrational (Fourier's Proof)

aliases:
  - irrationality of e
  - Fourier's proof
  - multiply by n! and bound the tail

source:
  name: Aigner & Ziegler - Proofs from THE BOOK
  url: https://link.springer.com/book/10.1007/978-3-662-57265-8
  original_title: Chapter "Some irrational numbers"
  author: Martin Aigner, Gunter M. Ziegler
  accessed: 2026-09-16

additional_sources:
  - name: Wikipedia
    url: https://en.wikipedia.org/wiki/Proof_that_e_is_irrational
    original_title: Proof that e is irrational

problem:
  statement: >
    Show that e = 1 + 1/1! + 1/2! + 1/3! + ... is irrational.
  domain: analysis
  answer: proved

key_idea:
  name: if e = p/q, multiply the series by q!; the first terms become integers and the tail is strictly between 0 and 1
  category: auxiliary_object
  summary: >
    Suppose e = p/q. Then q! e is an integer, and q! (1 + 1/1! + ... + 1/q!)
    is an integer, so the difference q! (1/(q+1)! + 1/(q+2)! + ...) is an
    integer. But that tail is less than 1/(q+1) + 1/(q+1)^2 + ... = 1/q <= 1
    and positive: no integer lies there.

intuitive_proof:
  explanation: >
    Assume e = p/q with positive integers p, q. Multiply the series by q!:
    q! e = q! p/q is an integer, and each term q!/k! for k <= q is an
    integer. So the tail T = sum over k > q of q!/k! must be an integer. Now
    q!/k! = 1/((q+1)(q+2)...k) <= 1/(q+1)^{k-q}, so 0 < T < sum over j >= 1
    of 1/(q+1)^j = 1/q <= 1. No integer lies strictly between 0 and 1,
    contradiction.

reasoning_structure:
  naive_approach: >
    Try to show the decimal expansion is non-repeating directly, which is
    hopeless.
  crucial_observation: >
    Multiplying by a factorial clears all denominators of the head of the
    series while leaving a tiny tail.
  why_it_simplifies: >
    The rapid growth of factorials makes the tail smaller than the gap
    between integers; this 'clear denominators and trap the remainder'
    scheme also proves the irrationality of pi (Niven).

