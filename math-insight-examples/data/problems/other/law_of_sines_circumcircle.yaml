id: law_of_sines_circumcircle

title: The Law of Sines from the Circumcircle

aliases:
  - law of sines
  - a = 2R sin A
  - extended law of sines

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Law_of_sines
  original_title: Law of sines (proof via the circumcircle)
  accessed: 2026-09-16

