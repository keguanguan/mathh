id: cantor_diagonal_uncountable

title: The Real Numbers Are Uncountable (Cantor's Diagonal Argument)

aliases:
  - Cantor's diagonal argument
  - uncountability of the reals
  - diagonalisation

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Cantor%27s_diagonal_argument
  original_title: Cantor's diagonal argument
  accessed: 2026-09-16

