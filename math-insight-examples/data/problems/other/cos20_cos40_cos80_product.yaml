problem:
  statement: >
    Show that cos 20 * cos 40 * cos 80 = 1/8 (angles in degrees).
  domain: algebra
  answer: 1/8

key_idea:
  name: multiply by sin 20 and apply the double-angle formula three times
  category: auxiliary_object
  summary: >
    Let P be the product. Then sin 20 * P = (1/2) sin 40 cos 40 cos 80 =
    (1/4) sin 80 cos 80 = (1/8) sin 160 = (1/8) sin 20. Cancel sin 20.

intuitive_proof:
  explanation: >
    Using 2 sin x cos x = sin 2x repeatedly: sin 20 cos 20 cos 40 cos 80 =
    (1/2) sin 40 cos 40 cos 80 = (1/4) sin 80 cos 80 = (1/8) sin 160. Since
    sin 160 = sin 20 and sin 20 != 0, dividing gives cos 20 cos 40 cos 80 =
    1/8. In general cos x cos 2x ... cos 2^{n-1} x = sin(2^n x)/(2^n sin x).

reasoning_structure:
  naive_approach: >
    Expand with product-to-sum formulas or compute the cosines numerically
    and recognise 0.125.
  crucial_observation: >
    Each cosine in the product is 'waiting' for the sine of the same angle
    to double it, and the angles form a doubling chain.
  why_it_simplifies: >
    One auxiliary factor sets off a chain reaction of three double-angle
    steps and cancels itself at the end.

