problem:
  statement: >
    Show that there are infinitely many prime numbers.
  domain: number theory
  answer: proved

key_idea:
  name: multiply the given primes together and add one
  category: number_theoretic_structure
  summary: >
    Given any finite list of primes, N = (their product) + 1 leaves
    remainder 1 on division by each of them, so any prime factor of N is a
    prime not in the list.

intuitive_proof:
  explanation: >
    Take any finite set of primes p_1, ..., p_k and form
    N = p_1 p_2 ... p_k + 1. N is larger than 1, so it has a prime factor
    q. But N leaves remainder 1 when divided by each p_i, so q is none of
    the p_i. Thus no finite set contains all primes; there are infinitely
    many. (N itself need not be prime, only its prime factors matter.)

reasoning_structure:
  naive_approach: >
    Try to produce ever-larger primes explicitly, or estimate how many
    primes there are below x.
  crucial_observation: >
    An auxiliary number can be built that is coprime to every prime in a
    given list, so its prime factors are new.
  why_it_simplifies: >
    A one-line construction defeats every finite list at once; no
    knowledge of the distribution of primes is required.

