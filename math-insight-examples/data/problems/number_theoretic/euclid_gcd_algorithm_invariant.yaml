id: euclid_gcd_algorithm_invariant

title: "Euclid's Algorithm: gcd(a, b) = gcd(b, a mod b)"

aliases:
  - Euclidean algorithm correctness
  - gcd invariant under remainder
  - common divisors of a, b and b, a mod b coincide

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Euclidean_algorithm
  original_title: Euclidean algorithm (proof of validity)
  accessed: 2026-09-16

