id: fermat_numbers_coprime_primes

title: Fermat Numbers Are Pairwise Coprime, so Primes Are Infinite

aliases:
  - Goldbach's proof of infinitude of primes
  - Fermat numbers pairwise coprime
  - F_n = 2^(2^n) + 1

source:
  name: Aigner & Ziegler - Proofs from THE BOOK
  url: https://link.springer.com/book/10.1007/978-3-662-57265-8
  original_title: Chapter 1, Six proofs of the infinity of primes
  author: Martin Aigner, Gunter M. Ziegler
  accessed: 2026-09-16

