problem:
  statement: >
    Show that C(n, k) = C(n - 1, k - 1) + C(n - 1, k).
  domain: combinatorics
  answer: proved

key_idea:
  name: split the k-subsets of an n-set according to whether they contain a fixed element x
  category: bijection
  summary: >
    The k-subsets containing x correspond to (k-1)-subsets of the other n -
    1 elements: C(n-1, k-1) of them. The k-subsets not containing x are
    k-subsets of the other n - 1 elements: C(n-1, k). Every k-subset is of
    exactly one kind.

intuitive_proof:
  explanation: >
    Fix an element x of the n-element set. A k-subset either contains x, in
    which case removing x leaves an arbitrary (k - 1)-subset of the
    remaining n - 1 elements (and this correspondence is a bijection), or
    does not contain x, in which case it is an arbitrary k-subset of the
    remaining n - 1 elements. The two families are disjoint and cover all
    k-subsets, so C(n, k) = C(n - 1, k - 1) + C(n - 1, k).

reasoning_structure:
  naive_approach: >
    Expand the factorial formula for both sides and bring to a common
    denominator.
  crucial_observation: >
    A single element partitions the subsets into two families that are
    themselves subsets of a smaller set.
  why_it_simplifies: >
    One case distinction on one element gives the recursion behind Pascal's
    triangle; the same distinction proves most binomial recursions.

