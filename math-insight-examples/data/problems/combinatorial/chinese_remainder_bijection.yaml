id: chinese_remainder_bijection

title: The Chinese Remainder Theorem by Counting

aliases:
  - Chinese remainder theorem
  - residues mod mn versus pairs of residues
  - injective hence bijective

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Chinese_remainder_theorem
  original_title: Chinese remainder theorem (proof)
  accessed: 2026-09-16

