id: secretary_problem_thirty_seven_percent

title: "The Secretary Problem: Skip the First n/e Candidates"

aliases:
  - secretary problem
  - 37% rule
  - optimal stopping for the best candidate

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Secretary_problem
  original_title: Secretary problem (deriving the optimal policy)
  accessed: 2026-09-16

additional_sources:
  - name: Ferguson - Who solved the secretary problem?
    notes: Statistical Science 4 (1989)

problem:
  statement: >
    n candidates are interviewed in random order; after each interview one
    must accept or reject irrevocably, and only relative ranks are observed.
    Show that the strategy 'reject the first r candidates, then accept the
    first one better than all previous' succeeds with probability about 1/e
    when r is about n/e, and that this is optimal among such strategies.
  domain: probability
  answer: >
    reject about n/e candidates, then take the next best-so-far; success
    probability tends to 1/e = 0.368

key_idea:
  name: "condition on the position k of the best candidate: the strategy wins iff the best of the first k - 1 lies among the first r, an event of probability r/(k - 1)"
  category: probabilistic_argument
  summary: >
    Condition on the position k of the best candidate. The strategy selects
    them iff the best of the first k - 1 candidates lies among the first r,
    which by symmetry has probability r/(k - 1). Summing over k gives P(win)
    = (r/n)(H_{n-1} - H_{r-1}), about (r/n) ln(n/r), which is maximised at r
    = n/e with value 1/e.

intuitive_proof:
  explanation: >
    Let B be the position of the best candidate; P(B = k) = 1/n. Given B = k
    > r, the strategy selects the best candidate iff none of the candidates
    in positions r + 1, ..., k - 1 is better than everyone before it, which
    happens iff the best among the first k - 1 candidates lies in the first
    r positions; by symmetry of random order this has probability r/(k - 1).
    For k <= r the strategy cannot win. Hence P(win) = sum over k = r+1..n
    of (1/n)(r/(k - 1)) = (r/n)(H_{n-1} - H_{r-1}). Approximating the
    harmonic sums by logarithms, P(win) is about x ln(1/x) with x = r/n,
    which is maximised at x = 1/e with maximum 1/e.

reasoning_structure:
  naive_approach: >
    Accept the first candidate who seems good, or always wait until the end,
    both of which succeed with probability about 1/n.
  crucial_observation: >
    Conditioning on where the best candidate sits reduces the whole strategy
    to a symmetry statement about where the best-so-far of an initial
    segment lies.
  why_it_simplifies: >
    One conditioning and one symmetry give an exact formula whose
    maximisation yields the famous 1/e.

