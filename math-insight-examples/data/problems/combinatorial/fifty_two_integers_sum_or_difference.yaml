problem:
  statement: >
    Show that among any 52 integers there are two whose sum or whose
    difference is divisible by 100.
  domain: number theory
  answer: proved

key_idea:
  name: group residues mod 100 into the 51 boxes {r, 100 - r}
  category: pigeonhole
  summary: >
    The boxes {0}, {50}, {1,99}, {2,98}, ..., {49,51} number 51. Two of 52
    integers have residues in the same box; if the residues are equal the
    difference is divisible by 100, if they are r and 100 - r the sum is.

intuitive_proof:
  explanation: >
    Reduce each integer mod 100. Form the 51 classes {0}, {50}, and {r, 100
    - r} for r = 1, ..., 49. Two of the 52 integers have residues in the
    same class. If the residues coincide, 100 divides their difference;
    otherwise the residues are r and 100 - r and 100 divides their sum.

reasoning_structure:
  naive_approach: >
    Look at residues mod 100 alone (100 boxes, not enough) and get stuck.
  crucial_observation: >
    Pairing r with -r halves the number of boxes, because both sums and
    differences are allowed.
  why_it_simplifies: >
    Choosing boxes adapted to the two allowed operations makes the count
    work exactly.

