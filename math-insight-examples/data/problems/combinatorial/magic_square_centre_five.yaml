id: magic_square_centre_five

title: The Centre of a 3x3 Magic Square Is 5

aliases:
  - 3x3 magic square centre
  - Lo Shu centre entry
  - magic constant 15

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Magic_square
