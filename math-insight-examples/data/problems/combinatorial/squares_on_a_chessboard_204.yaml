    url: https://link.springer.com/book/10.1007/b97682
    original_title: Chapter 5, Enumerative Combinatorics
    author: Arthur Engel

problem:
  statement: >
    How many squares of all sizes (1x1 up to 8x8) can be found on an 8x8
    chessboard?
  domain: combinatorics
  answer: 204 = 1 + 4 + 9 + ... + 64

key_idea:
  name: a k x k square is determined by its top-left corner, which can be any of the (9 - k)^2 cells whose row and column are at most 9 - k
  category: bijection
  summary: >
    For each size k, the top-left cell of a k x k square must lie in the
    top-left (9 - k) x (9 - k) region, so there are (9 - k)^2 such squares.
    Summing over k = 1..8 gives 8^2 + 7^2 + ... + 1^2 = 204.

intuitive_proof:
  explanation: >
    A k x k square on the board is determined by its top-left corner cell
    (i, j), which must satisfy i <= 9 - k and j <= 9 - k so that the square
    fits. Thus there are (9 - k)^2 squares of side k, and the total is the
    sum of m^2 for m = 1..8, namely 8 * 9 * 17/6 = 204.

reasoning_structure:
  naive_approach: >
    Count squares by drawing them, or count only the 64 unit squares.
  crucial_observation: >
    Each square corresponds to one corner cell, and the corner cells of
    size-k squares form a smaller board.
  why_it_simplifies: >
    A bijection between squares and corner cells turns the count into a sum
    of perfect squares.

