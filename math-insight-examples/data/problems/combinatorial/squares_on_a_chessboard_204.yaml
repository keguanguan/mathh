id: squares_on_a_chessboard_204

title: How Many Squares Are on a Chessboard?

aliases:
  - squares on a chessboard 204
  - counting squares of all sizes
  - sum of squares 1 to 8

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Square_pyramidal_number
  original_title: Square pyramidal number (squares on a chessboard)
  accessed: 2026-09-16

additional_sources:
