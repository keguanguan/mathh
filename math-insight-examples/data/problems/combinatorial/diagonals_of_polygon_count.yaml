id: diagonals_of_polygon_count

title: A Convex n-gon Has n(n - 3)/2 Diagonals

aliases:
  - number of diagonals of a polygon
  - n(n-3)/2 diagonals
  - each vertex sees n - 3 diagonals

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Diagonal
  original_title: Diagonal (polygons)
  accessed: 2026-09-16

