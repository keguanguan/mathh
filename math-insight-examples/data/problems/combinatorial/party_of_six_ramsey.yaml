problem:
  statement: >
    Any two of six people are either acquainted or strangers. Show that
    there are three people who are mutually acquainted or three who are
    mutual strangers.
  domain: graph theory
  answer: proved

key_idea:
  name: one person has three relations of the same kind; then look at those three
  category: pigeonhole
  summary: >
    Fix a person P. Of the other five, at least three are related to P in
    the same way, say acquainted. If any two of those three are acquainted,
    they form a triangle with P; if none are, the three are mutual strangers.

intuitive_proof:
  explanation: >
    Pick any person P. P has five relationships, each of two kinds, so by
    pigeonhole at least three are of the same kind; say P knows A, B and C
    (the other case is symmetric). Now consider the pairs among A, B, C. If
    some pair, say A and B, are acquainted, then P, A, B are three mutual
    acquaintances. Otherwise A, B, C are pairwise strangers. Either way the
    required triple exists.

reasoning_structure:
  naive_approach: >
    Enumerate colourings of the 15 pairs (2^15 of them) or argue through
    many cases.
  crucial_observation: >
    Concentrate on one vertex; pigeonhole forces three same-coloured edges,
    and the triangle among their endpoints is then unavoidable either way.
  why_it_simplifies: >
    Two applications of "either/or" replace a 32768-case search; five people
    do not suffice, so the bound is sharp.

