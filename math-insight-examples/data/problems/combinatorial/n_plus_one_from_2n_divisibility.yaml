id: n_plus_one_from_2n_divisibility

title: Among n+1 Numbers from 1 to 2n, One Divides Another

aliases:
  - Erdos divisibility pigeonhole
  - n+1 integers from {1,...,2n}
  - odd part pigeonhole

source:
  name: Aigner & Ziegler - Proofs from THE BOOK
  url: https://link.springer.com/book/10.1007/978-3-662-57265-8
  original_title: Chapter "Pigeon-hole and double counting"
  author: Martin Aigner, Gunter M. Ziegler
  accessed: 2026-09-16
  notes: >
    Springer, 6th edition 2018. The problem is Erdos's; he reportedly posed it
    to the young Lajos Posa, who solved it in minutes.

additional_sources:
  - name: Engel - Problem-Solving Strategies
    notes: Chapter 4, The Box Principle.

problem:
  statement: >
    Choose any n + 1 distinct integers from {1, 2, ..., 2n}. Show that one of
    them divides another.
  domain: number theory
  answer: proved

key_idea:
  name: sort the numbers by their odd part
  category: pigeonhole
  summary: >
    Write each chosen number as 2^k * m with m odd. There are only n odd
    numbers below 2n, so two chosen numbers share the same odd part m, and
    then the one with the smaller power of 2 divides the other.

intuitive_proof:
  explanation: >
    Every positive integer is uniquely 2^k times an odd number m, its odd
    part. For numbers up to 2n the odd part is one of the n odd numbers
    1, 3, ..., 2n - 1. Among n + 1 chosen numbers, two must have the same odd
    part by the pigeonhole principle: 2^a * m and 2^b * m with a < b. The
    first divides the second.

reasoning_structure:
  naive_approach: >
    Try to build a large set with no divisibility (e.g. n+1, ..., 2n gives n
    elements) and argue that adding any element creates a divisibility;
    hard to make rigorous.
  crucial_observation: >
    The right "boxes" are the odd parts: numbers in the same box are
    comparable under divisibility.
  why_it_simplifies: >
    One clever choice of boxes turns the statement into a direct count
    (n boxes, n + 1 objects).

tags:
  - pigeonhole
  - divisibility
  - odd part
  - number theory

quality:
  clarity_of_key_idea: high
  elegance: high
  naive_search_contrast: high
  pedagogical_value: high

familiarity:
  famous: true
  likely_widely_known: true

notes: >
  The bound is sharp: {n+1, ..., 2n} has n elements and no divisibility.
