    original_title: Planar graph (properties)

problem:
  statement: >
    Show that every simple planar graph has a vertex of degree at most 5.
  domain: graph theory
  answer: proved

key_idea:
  name: the edge bound E <= 3V - 6 makes the average degree less than 6
  category: double_counting
  summary: >
    Summing degrees counts each edge twice, so the average degree is 2E/V <=
    (6V - 12)/V < 6. A set of integers with average less than 6 contains one
    that is at most 5.

intuitive_proof:
  explanation: >
    For a simple planar graph with V >= 3 vertices, Euler's formula and the
    face count give E <= 3V - 6. The handshake lemma gives sum of degrees =
    2E <= 6V - 12, so the average degree is at most 6 - 12/V < 6. Hence some
    vertex has degree at most 5. (For V <= 2 the statement is trivial.)

reasoning_structure:
  naive_approach: >
    Try to draw a planar graph in which every vertex has degree at least 6
    and observe failure.
  crucial_observation: >
    A global edge bound translates into a bound on the average degree, and
    the minimum is at most the average.
  why_it_simplifies: >
    Two counts (Euler and handshake) give the lemma that powers the
    five-colour theorem and the proof strategy for the four-colour theorem.

