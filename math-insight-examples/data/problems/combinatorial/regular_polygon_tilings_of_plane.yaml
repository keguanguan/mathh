id: regular_polygon_tilings_of_plane

title: Only Triangles, Squares and Hexagons Tile the Plane Regularly

aliases:
  - regular tessellations
  - which regular polygons tile the plane
  - 360 divided by interior angle

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Euclidean_tilings_by_convex_regular_polygons
  original_title: Euclidean tilings by convex regular polygons (regular tilings)
  accessed: 2026-09-16

