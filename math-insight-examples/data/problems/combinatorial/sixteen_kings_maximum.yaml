    author: Arthur Engel

problem:
  statement: >
    Show that at most 16 kings can be placed on an 8x8 board so that no two
    attack each other.
  domain: combinatorics
  answer: "16"

key_idea:
  name: cut the board into sixteen 2x2 blocks; any two squares of a block are adjacent, so each block holds at most one king
  category: pigeonhole
  summary: >
    A king attacks all eight neighbouring squares, so two kings in the same
    2x2 block attack each other. The board splits into 16 such blocks,
    giving at most 16 kings, and one king in the corner of each block
    achieves 16.

intuitive_proof:
  explanation: >
    Partition the board into 16 blocks of size 2x2. Any two squares within a
    block share an edge or a corner, so they are a king's move apart, and a
    block contains at most one king. Hence at most 16 kings in total.
    Placing a king in the top-left square of every block gives 16 kings with
    no two adjacent.

reasoning_structure:
  naive_approach: >
    Try placements and count.
  crucial_observation: >
    The board partitions into pieces that can each hold only one king.
  why_it_simplifies: >
    Partition and pigeonhole give the bound; the same partition gives the
    construction.

