problem:
  statement: >
    A prize is behind one of three doors. You pick a door; the host, who
    knows where the prize is, opens another door showing no prize and offers
    to let you switch. Should you switch?
  domain: probability
  answer: >
    switch: it wins with probability 2/3, staying wins with probability 1/3

key_idea:
  name: your first pick is right with probability 1/3, and the host's action never changes that; switching wins exactly when the first pick was wrong
  category: probabilistic_argument
  summary: >
    The first choice is correct with probability 1/3, wrong with probability
    2/3. The host always opens a non-prize door, so the 'wrong' case leaves
    the prize behind the one remaining door. Switching therefore wins with
    probability 2/3.

intuitive_proof:
  explanation: >
    Condition on the first pick. With probability 1/3 it hides the prize,
    and switching loses. With probability 2/3 it does not, and then the
    host, forced to open the other non-prize door, leaves the prize behind
    the only unopened door, so switching wins. Hence switching wins with
    probability 2/3. The intuition '50-50 between two doors' ignores that
    the host's choice is constrained by the location of the prize.

reasoning_structure:
  naive_approach: >
    Argue that two doors remain and each is equally likely, so switching
    does not matter.
  crucial_observation: >
    The host's revelation is informative because it is constrained: he must
    avoid the prize.
  why_it_simplifies: >
    Splitting by the first pick makes the 2/3 obvious; the extreme version
    with 100 doors (host opens 98) makes it visceral.

