problem:
  statement: >
    A floor is ruled with parallel lines a distance d apart. A needle of
    length L <= d is dropped at random. Show that the probability that it
    crosses a line is 2L/(pi d).
  domain: probability
  answer: 2L/(pi d)

key_idea:
  name: the expected number of crossings is additive in length, so compute it for a circle
  category: probabilistic_argument
  summary: >
    For a needle of length L <= d, the probability of crossing equals the
    expected number of crossings E(L). Bending or chaining needles does not
    change the expectation of the total (linearity), so E is proportional to
    length: E(L) = cL. A circle of diameter d, a "noodle" of length pi d,
    crosses the lines exactly twice always, so c * pi d = 2.

intuitive_proof:
  explanation: >
    Let E(L) be the expected number of crossings for a randomly dropped
    needle of length L (for L <= d this is at most one crossing, so E(L)
    is the probability we want). Two needles joined end to end, dropped
    together, have expected crossings E(L_1) + E(L_2) by linearity of
    expectation, whatever the angle between them, so E is additive, hence
    E(L) = cL for a constant c; by approximation the same holds for any
    curve of length L, straight or bent. Now drop a circle of diameter d:
    however it lands it crosses the lines exactly twice, so
    2 = c * (pi d), giving c = 2/(pi d). Hence a needle of length L <= d
    crosses a line with probability 2L/(pi d).

reasoning_structure:
  naive_approach: >
    Parametrise the needle by its centre's distance to the nearest line
    and its angle, and integrate sin over the angle, a calculus
    computation that hides why pi appears.
  crucial_observation: >
    Expectation is linear even for dependent pieces, so the problem is
    determined by a single constant, and a circle fixes the constant
    without any integral.
  why_it_simplifies: >
    A choice of the right test object (the circle) replaces the integral;
    the argument also proves Barbier's theorem that all curves of constant
    width have the same perimeter.

