id: buffon_needle_barbier

title: Buffon's Needle via Linearity of Expectation (Barbier's Argument)

aliases:
  - Buffon's needle
  - Buffon's noodle
  - Barbier's solution of Buffon's needle

source:
  name: Aigner & Ziegler - Proofs from THE BOOK
  url: https://link.springer.com/book/10.1007/978-3-662-57265-8
  original_title: Chapter "Buffon's needle problem"
  author: Martin Aigner, Gunter M. Ziegler
  accessed: 2026-09-16
  notes: Buffon (1777); the expectation argument is E. Barbier's (1860).

additional_sources:
  - name: Wikipedia
    url: https://en.wikipedia.org/wiki/Buffon%27s_needle_problem
    original_title: Buffon's needle problem
  - name: Cut-the-Knot
