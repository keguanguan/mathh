id: surjections_inclusion_exclusion

title: Counting Onto Functions by Inclusion-Exclusion

aliases:
  - number of surjections
  - onto functions count
  - Stirling numbers via inclusion-exclusion

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Inclusion%E2%80%93exclusion_principle
  original_title: Inclusion–exclusion principle (counting surjections)
  accessed: 2026-09-16

