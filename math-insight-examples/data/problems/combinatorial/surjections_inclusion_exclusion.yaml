    author: Arthur Engel

problem:
  statement: >
    How many functions from an n-element set onto a k-element set are there?
  domain: combinatorics
  answer: sum over j of (-1)^j C(k, j) (k - j)^n

key_idea:
  name: count all functions and subtract those missing at least one target value, using inclusion-exclusion over the set of missed values
  category: inclusion_exclusion
  summary: >
    Let A_i be the set of functions whose image misses value i. Functions
    missing a prescribed set of j values number (k - j)^n. By
    inclusion-exclusion the number of functions missing no value is sum over
    j of (-1)^j C(k, j)(k - j)^n.

intuitive_proof:
  explanation: >
    There are k^n functions in all. For a set S of j target values, exactly
    (k - j)^n functions avoid all of S (each of the n inputs maps into the
    other k - j values). By the inclusion-exclusion principle, the number of
    functions avoiding none of the values, i.e. the surjections, is sum over
    S of (-1)^{|S|} (k - |S|)^n = sum over j = 0..k of (-1)^j C(k, j)(k -
    j)^n. Dividing by k! gives the Stirling number of the second kind S(n,
    k), the number of partitions of an n-set into k non-empty blocks.

reasoning_structure:
  naive_approach: >
    Count surjections directly by choosing the preimage sizes, which leads
    to sums of multinomial coefficients.
  crucial_observation: >
    'Onto' is 'misses nothing', and 'misses a given set' is trivial to
    count, so the complement is an inclusion-exclusion over missed sets.
  why_it_simplifies: >
    Inclusion-exclusion converts a hard 'all values hit' condition into easy
    'these values avoided' counts.

