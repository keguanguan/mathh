id: sum_of_binomial_squares_central

title: The Sum of Squares of Binomial Coefficients

aliases:
  - sum of C(n,k)^2 = C(2n,n)
  - central binomial coefficient identity
  - paths through the middle

source:
  name: Wikipedia
