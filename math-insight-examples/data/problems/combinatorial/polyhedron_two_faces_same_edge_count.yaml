id: polyhedron_two_faces_same_edge_count

title: Every Polyhedron Has Two Faces with the Same Number of Edges

aliases:
  - two faces with equally many sides
  - polyhedron faces pigeonhole

source:
  name: Engel - Problem-Solving Strategies
  url: https://link.springer.com/book/10.1007/b97682
