id: ramsey_lower_bound_random

title: Erdos's Probabilistic Lower Bound for Ramsey Numbers

aliases:
  - R(k,k) > 2^{k/2}
  - random colouring Ramsey bound
  - Erdos 1947

source:
  name: Aigner & Ziegler - Proofs from THE BOOK
  url: https://link.springer.com/book/10.1007/978-3-662-57265-8
  original_title: Chapter "Probability makes counting (sometimes) easy"
  author: Martin Aigner, Gunter M. Ziegler
  accessed: 2026-09-16
  notes: Erdos (1947), the birth of the probabilistic method.

additional_sources:
  - name: Wikipedia
