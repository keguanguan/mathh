id: three_utilities_problem_nonplanar

title: "The Three Utilities Problem: K_{3,3} Is Not Planar"

aliases:
  - three utilities problem
  - water gas electricity puzzle
  - K3,3 nonplanar

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Three_utilities_problem
  original_title: Three utilities problem
  accessed: 2026-09-16

