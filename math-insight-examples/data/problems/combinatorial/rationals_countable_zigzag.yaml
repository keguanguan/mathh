id: rationals_countable_zigzag

title: The Rational Numbers Are Countable

aliases:
  - countability of the rationals
  - Cantor's zigzag
  - enumerating fractions

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Countable_set
