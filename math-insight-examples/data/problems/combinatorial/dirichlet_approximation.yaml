id: dirichlet_approximation

title: Dirichlet's Approximation Theorem

aliases:
  - Dirichlet approximation
  - "|q alpha - p| < 1/N"
  - rational approximation by pigeonhole

source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Dirichlet%27s_approximation_theorem
  original_title: Dirichlet's approximation theorem
  accessed: 2026-09-16

additional_sources:
  - name: Engel - Problem-Solving Strategies
    url: https://link.springer.com/book/10.1007/b97682
