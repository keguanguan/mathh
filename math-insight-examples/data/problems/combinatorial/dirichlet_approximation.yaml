problem:
  statement: >
    Let alpha be a real number and N a positive integer. Show that there are
    integers p and q with 1 <= q <= N and |q alpha - p| < 1/N.
  domain: number theory
  answer: proved

key_idea:
  name: the N + 1 fractional parts {0}, {alpha}, ..., {N alpha} fall into N intervals of length 1/N
  category: pigeonhole
  summary: >
    Two of the N + 1 numbers {k alpha}, 0 <= k <= N, lie in the same
    interval [j/N, (j+1)/N). Their difference is (k_2 - k_1) alpha minus an
    integer, of absolute value less than 1/N, with 1 <= k_2 - k_1 <= N.

intuitive_proof:
  explanation: >
    Divide [0, 1) into N half-open intervals of length 1/N. The N + 1
    fractional parts {k alpha} for k = 0, ..., N are N + 1 points in N
    intervals, so two of them, {k_1 alpha} and {k_2 alpha} with k_1 < k_2,
    are within 1/N of each other. Writing {k alpha} = k alpha - floor(k
    alpha), the difference is q alpha - p with q = k_2 - k_1 in [1, N] and p
    an integer, and |q alpha - p| < 1/N.

reasoning_structure:
  naive_approach: >
    Use continued fractions, which give the result but require their whole
    theory.
  crucial_observation: >
    Fractional parts of multiples of alpha are points on a circle, and more
    points than boxes forces two to be close.
  why_it_simplifies: >
    A pure counting argument yields the fundamental approximation inequality
    in three lines.

