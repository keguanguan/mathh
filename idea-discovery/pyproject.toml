[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-discovery"
version = "0.1.0"
description = "Experimental pipeline for measuring mathematical idea discovery in language models."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
